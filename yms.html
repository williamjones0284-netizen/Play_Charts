    background-size:72% auto;

    z-index:0;
  }
  header, main, #undoBar{ position:relative; z-index:1; }

  /* Header */
  header{
    position:sticky; top:0; z-index:20;
    background: var(--field-deep);
    border-bottom: 2px solid var(--gold-deep);
    padding: 10px 14px 0 14px;
  }
  .headrow{ display:flex; align-items:center; gap:10px; }
  .headrow h1{
    font-family:'Bebas Neue', 'Arial Narrow', sans-serif;
    font-size:21px; letter-spacing:0.4px; margin:0; flex-shrink:0; color:var(--gold);
    white-space:nowrap;
  }
  #gameLabel{
    flex:1; min-width:0;
    background:transparent; border:none; border-bottom:1px solid var(--line);
    color:var(--chalk-dim); font-family:'Inter',sans-serif; font-size:13px;
    padding:6px 2px; outline:none;
  }
  #gameLabel::placeholder{ color:#5C7A6D; }
  #gameLabel:focus{ border-bottom-color: var(--gold); color:var(--chalk); }
  .tabs{ display:flex; gap:0; margin-top:10px; }
  .tab{
    flex:1; text-align:center; padding:10px 0; font-size:14px; font-weight:700;
    color: var(--chalk-dim); border-bottom:3px solid transparent; cursor:pointer;
    letter-spacing:0.3px;
  }
  .tab.active{ color:var(--gold); border-bottom-color: var(--gold); }
  .tab .count{
    display:inline-block; margin-left:6px; background:var(--panel-raised); color:var(--chalk);
    font-size:11px; padding:1px 7px; border-radius:20px;
  }

  main{ flex:1; padding:16px 14px 100px 14px; }

  /* Breadcrumb of current play being built */
  .buildbar{
    display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; min-height:30px;
  }
  .chip{
    padding:6px 12px; border-radius:20px; font-size:13px; font-weight:600;
    background: var(--panel); border:1px solid var(--line); color:var(--chalk-dim);
  }
  .chip.filled{ background: var(--gold); color: var(--ink); border-color:var(--gold); }
  .chip.editable{ cursor:pointer; }

  .stepLabel{
    font-size:12px; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:1.5px;
    margin-bottom:10px; font-weight:600;
  }

  .grid{ display:grid; gap:10px; }
  .grid.cols2{ grid-template-columns: 1fr 1fr; }
  .grid.cols3{ grid-template-columns: 1fr 1fr 1fr; }
  .grid.cols1{ grid-template-columns: 1fr; }

  .bigbtn{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--chalk);
    border-radius: var(--radius);
    padding: 20px 8px;
    font-family:'Bebas Neue','Arial Narrow',sans-serif;
    font-size: 26px;
    letter-spacing: 0.5px;
    text-align:center;
    cursor:pointer;
    transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
    user-select:none;
  }
  .bigbtn:active{ transform: scale(0.96); }
  .bigbtn:hover{ border-color: var(--gold-deep); }
  .bigbtn.small{ font-size:20px; padding:16px 8px; }
  .bigbtn .sub{
    display:block; font-family:'Inter',sans-serif; font-size:11px; letter-spacing:0.3px;
    color:var(--chalk-dim); margin-top:3px; font-weight:500;
  }
  .bigbtn.selected{ background: var(--gold); color: var(--ink); border-color: var(--gold); }
  .bigbtn.selected .sub{ color: rgba(12,36,29,0.65); }
  .bigbtn.skip{ background:transparent; border-style:dashed; color:var(--chalk-dim); font-size:16px; padding:14px 8px; }

  .navrow{ display:flex; gap:10px; margin-top:18px; }
  .navbtn{
    flex:1; padding:14px; border-radius: var(--radius); text-align:center;
    font-weight:700; font-size:15px; cursor:pointer; border:1px solid var(--line);
  }
  .navbtn.back{ background:transparent; color:var(--chalk-dim); }
  .navbtn.primary{ background: var(--gold); color: var(--ink); border-color:var(--gold); }
  .navbtn.primary:active, .navbtn.back:active{ transform: scale(0.98); }

  /* Down/distance & result steppers */
  .stepperRow{
    display:flex; align-items:center; justify-content:center; gap:18px; margin: 6px 0 18px 0;
  }
  .stepperBtn{
    width:52px; height:52px; border-radius:50%; background:var(--panel); border:1px solid var(--line);
    color:var(--chalk); font-size:26px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
  }
  .stepperBtn:active{ transform:scale(0.92); }
  .stepperVal{
    font-family:'Bebas Neue','Arial Narrow',sans-serif; font-size:46px; min-width:90px; text-align:center;
    color:var(--chalk);
  }
  .stepperVal.neg{ color: var(--loss); }
  .stepperVal.pos{ color: var(--gain); }
  .chipsRow{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:14px; }
  .quickchip{
    padding:8px 14px; border-radius:8px; background:var(--panel); border:1px solid var(--line);
    color:var(--chalk-dim); font-size:14px; font-weight:700; cursor:pointer;
  }
  .quickchip:active{ transform:scale(0.95); }
  .togglechip{
    padding:9px 16px; border-radius:8px; background:transparent; border:1px solid var(--line);
    color:var(--chalk-dim); font-size:13px; font-weight:700; cursor:pointer; letter-spacing:0.5px;
  }
  .togglechip.on.td{ background: var(--gain); color:var(--ink); border-color:var(--gain); }
  .togglechip.on.to{ background: var(--loss); color:var(--ink); border-color:var(--loss); }
  .togglechip.on.penO{ background: var(--loss); color:#fff; border-color:var(--loss); }
  .togglechip.on.penD{ background: var(--gain); color:var(--ink); border-color:var(--gain); }

  /* Log tab */
  .statsRow{ display:flex; gap:8px; margin-bottom:16px; }
  .statCard{
    flex:1; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px; text-align:center;
  }
  .statCard .num{ font-family:'Bebas Neue','Arial Narrow',sans-serif; font-size:28px; color:var(--gold); }
  .statCard .lbl{ font-size:10px; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:1px; }

  .logrow{

<script>
window.onerror = function(msg, url, line, col, err){
  var m = document.getElementById('main');
  if(m){
    m.innerHTML = '<div style="color:#F2EFE4;padding:16px;font-family:monospace;font-size:13px;line-height:1.5;white-space:pre-wrap;">App failed to start:\n\n' + msg + '\n(line ' + line + ')</div>';

(function(){

  var FORMATIONS = ['Ace','Early','Late','Doubles','Ding','Tricky','Deuce','Deuce Rt','Deuce Lt','X-Wing','Z-Wing'];
  var RUN_PLAYS = ['2','5','9'];
  var PASS_PLAYS = ['91','92','94','96','97'];
  var TAG_OPTIONS = ['Rattler','Switch','W','Grab','X','H','Y','Z','F','Go','Slant','Hitch','Smoke','Sluggo','Dig','Q','Lead','Lucky'];
  var RPO_PLAYS = ['12','15','22','25','42','72','75','65','62','45'];
  var ALIGNMENT_OPTIONS = ['Flip','H Back','Y Back','Z Back'];
  var MOTION_OPTIONS = ['H Jet','Y Jet','X Jet','Z Jet'];

  var plays = [];
  var meta = { gameLabel: '' };
  var oppEvents = [];
  var activeTab = 'chart';
  var lastDeleted = null;
  var clearArmed = false;
  var clearArmTimer = null;
  var undoTimer = null;
  var isCoach = false;
  var authReady = false;
  var lastLoadedFromRemote = false;
  var signInFormOpen = false;
  var signInError = '';

  function getOppScore(){
    return oppEvents.reduce(function(s, e){ return s + e.points; }, 0);
  }

  var current = freshPlay();
  var stepIdx = 0;
  var tpStepIdx = 0;

  function freshPlay(keepFormation){
    return {
      formation: keepFormation ? current.formation : null,
      alignment: keepFormation ? current.alignment : null,
      motion: keepFormation ? current.motion : null,
      category: null,
      play: null,
      direction: null,
      tag: [],
      down: (plays.length ? suggestNext().down : 1),
      distance: (plays.length ? suggestNext().distance : 10),
      yards: 0,
      outcome: null,
      twoPt: freshTwoPt()
    };
  }

  function freshTwoPt(){
    return {
      formation: null,
      alignment: null,
      motion: null,
      category: null,
      play: null,
      direction: null,
      tag: [],
      result: null
    };
  }

  function realPlays(){
    return plays.filter(function(p){ return !p.isMarker; });
  }

  var reportOpen = false;
  var EXPLOSIVE_THRESHOLDS = { Run: 10, RPO: 12, Pass: 15 };

  // Stat plays exclude penalties — a penalty's "yards" field is the
  // penalty yardage awarded, not a play result, so it doesn't belong in
  // averages or explosive-play counts.
  function statPlays(){
    return realPlays().filter(function(p){
      return p.outcome !== 'OPEN' && p.outcome !== 'DPEN';
    });
  }

  function isExplosive(p){
    var t = EXPLOSIVE_THRESHOLDS[p.category] || 10;
    return p.yards >= t;
  }

  function callKey(p){
    var parts = [p.category, p.play];
    if(p.direction) parts.push(p.direction);
    return parts.join(' ');
  }

  function buildRunReport(){
    var sp = statPlays();
    var explosive = sp.filter(isExplosive).slice().sort(function(a,b){ return b.yards - a.yards; });

    var groups = {};
    sp.forEach(function(p){
      var k = callKey(p);
      if(!groups[k]) groups[k] = { key: k, count: 0, total: 0 };
      groups[k].count++;
      groups[k].total += p.yards;
    });
    var calls = Object.keys(groups).map(function(k){
      var g = groups[k];
      return { key: g.key, count: g.count, total: g.total, avg: g.total / g.count };
    }).sort(function(a,b){ return b.avg - a.avg; });

    return { explosive: explosive, calls: calls };
  }

  function suggestNext(){
    var rp = realPlays();
    if(!rp.length) return {down:1, distance:10};
    var last = rp[rp.length-1];
    // Defensive floor: a distance of 10 or less should never have been
    // possible to save as 0 or negative, but if an older/corrupted entry
    // ever has one, treat it as 1 rather than letting it poison the
    // "reached the sticks" comparison below.
    var lastDistance = Math.max(1, last.distance);
    if(last.outcome === 'TD' || last.outcome === 'FUM' || last.outcome === 'INT' || last.outcome === 'TOD'){
      return {down:1, distance:10};
    }
    if(last.outcome === 'DPEN'){
      // Defensive penalty: automatic first down if the penalty yardage
      // reaches the sticks, otherwise the down replays (same down) with
      // distance reduced by the penalty yardage.
      if(last.yards >= lastDistance){
        return {down:1, distance:10};
      }
      var dDist = lastDistance - last.yards;
      if(dDist < 1) dDist = 1;
      return {down: last.down, distance: dDist};
    }
    if(last.outcome === 'OPEN'){
      // Offensive penalty: down replays (same down), distance pushed back
      // by the penalty yardage.
      return {down: last.down, distance: Math.max(1, lastDistance + last.yards)};
    }
    if(last.yards >= lastDistance){
      return {down:1, distance:10};
    }
    var nd = last.down + 1;
    if(nd > 4) nd = 1;
    var dist = lastDistance - last.yards;
    if(dist < 1) dist = 1;
    return {down: nd, distance: dist};
  }

  function getSteps(){
    var s = ['formation','alignment','motion','category'];
    if(current.category === 'Run') s = s.concat(['play','direction']);
    else if(current.category === 'Pass') s = s.concat(['play']);
    else if(current.category === 'RPO') s = s.concat(['play','direction']);
    s = s.concat(['tag','downdistance','result']);
    if(current.outcome === 'TD') s = s.concat(['twopoint']);
    return s;
  }

  function getTwoPtSteps(){
    var tp = current.twoPt;
    var s = ['formation','alignment','motion','category'];
    if(tp.category === 'Run') s = s.concat(['play','direction']);
    else if(tp.category === 'Pass') s = s.concat(['play']);
    else if(tp.category === 'RPO') s = s.concat(['play','direction']);
    s = s.concat(['tag','result']);
    return s;
  }

  function canAdvanceTwoPt(stepName){
    var tp = current.twoPt;
    if(stepName === 'formation') return !!tp.formation;
    if(stepName === 'alignment') return true;
    if(stepName === 'category') return !!tp.category;
    if(stepName === 'play') return !!tp.play;
    if(stepName === 'direction') return !!tp.direction;
    if(stepName === 'tag') return true;
    if(stepName === 'motion') return true;
    if(stepName === 'result') return !!tp.result;
    return true;
  }

  function tpChip(label){
    return '<div class="chip filled">' + label + '</div>';
  }

  function renderTwoPointStep(){
    var tp = current.twoPt;
    var steps = getTwoPtSteps();
    var stepName = steps[tpStepIdx];
    var html = '';

    html += '<div class="stepLabel" style="margin-top:2px;">2-point attempt</div>';
    var chips = '';
    if(tp.formation) chips += tpChip(tp.formation);
    if(tp.alignment) chips += tpChip(tp.alignment);
    if(tp.motion) chips += tpChip(tp.motion);
    if(tp.category) chips += tpChip(tp.category);
    if(tp.play) chips += tpChip(tp.play);
    if(tp.direction) chips += tpChip(tp.direction);
    if(tp.tag && tp.tag.length) tp.tag.forEach(function(t){ chips += tpChip(t); });
    html += '<div class="buildbar">' + (chips || '<div class="chip" style="opacity:0.5;">Building 2-point play&hellip;</div>') + '</div>';

    if(stepName === 'formation'){
      html += '<div class="stepLabel">Formation</div>';
      html += '<div class="grid cols2">';
      FORMATIONS.forEach(function(f){
        html += bigBtn(f, f === tp.formation, 'picktp3', 'formation', f);
      });
      html += '</div>';
    }

    else if(stepName === 'alignment'){
      html += '<div class="stepLabel">Alignment <span style="opacity:0.6;font-weight:400; text-transform:none; letter-spacing:0;">(skip for Normal)</span></div>';
      html += '<div class="grid cols3" style="grid-template-columns:repeat(3,1fr);">';
      ALIGNMENT_OPTIONS.forEach(function(a){
        html += bigBtn(a, a === tp.alignment, 'picktp3', 'alignment', a, 'small');
      });
      html += '</div>';
    }

    else if(stepName === 'motion'){
      html += '<div class="stepLabel">Motion <span style="opacity:0.6;font-weight:400;">(optional)</span></div>';
      html += '<div class="grid cols3" style="grid-template-columns:repeat(3,1fr);">';
      MOTION_OPTIONS.forEach(function(m){
        html += bigBtn(m, m === tp.motion, 'picktp3', 'motion', m, 'small');
      });
      html += '</div>';
      html += '<div class="grid cols2" style="margin-top:10px;">';
      html += '<div class="bigbtn skip" data-act="picktp3" data-field="motion" data-val="">No motion</div>';
      html += '</div>';
    }

    else if(stepName === 'category'){
      html += '<div class="stepLabel">Play type</div>';
      html += '<div class="grid cols3">';
      ['Run','Pass','RPO'].forEach(function(c){
        html += bigBtn(c, c === tp.category, 'picktp3', 'category', c, 'small');
      });
      html += '</div>';
    }

    else if(stepName === 'play'){
      var list = tp.category === 'Run' ? RUN_PLAYS : tp.category === 'Pass' ? PASS_PLAYS : RPO_PLAYS;
      html += '<div class="stepLabel">' + tp.category + ' call</div>';
      html += '<div class="grid ' + (list.length > 6 ? 'cols3' : 'cols2') + '">';
      list.forEach(function(p){
        html += bigBtn(p, p === tp.play, 'picktp3', 'play', p);
      });
      html += '</div>';
    }

    else if(stepName === 'direction'){
      html += '<div class="stepLabel">Direction</div>';
      html += '<div class="grid cols2">';
      ['Up','Down'].forEach(function(d){
        html += bigBtn(d, d === tp.direction, 'picktp3', 'direction', d);
      });
      html += '</div>';
    }

    else if(stepName === 'tag'){
      html += '<div class="stepLabel">Tag <span style="opacity:0.6;font-weight:400;">(optional, pick as many as apply)</span></div>';
      html += '<div class="grid cols3">';
      TAG_OPTIONS.forEach(function(t){
        html += bigBtn(t, tp.tag.indexOf(t) !== -1, 'toggletagtp', 'tag', t, 'small');
      });
      html += '</div>';
      if(tp.tag.length){
        html += '<div class="grid cols2" style="margin-top:10px;">';
        html += '<div class="bigbtn skip" data-act="cleartagtp">Clear tags</div>';
        html += '</div>';
      }
    }

    else if(stepName === 'result'){
      html += '<div class="stepLabel">Result</div>';
      html += '<div class="chipsRow">';
      html += '<div class="togglechip td ' + (tp.result==='Good'?'on td':'') + '" data-act="picktp3" data-field="result" data-val="Good">Good</div>';
      html += '<div class="togglechip to ' + (tp.result==='No Good'?'on to':'') + '" data-act="picktp3" data-field="result" data-val="No Good">No good</div>';
      html += '</div>';
    }

    var isLast = (tpStepIdx === steps.length - 1);
    html += '<div class="navrow">';
    html += '<div class="navbtn back" id="tpBackBtn">Back</div>';
    if(isLast){
      if(canAdvanceTwoPt(stepName)){
        html += '<div class="navbtn primary" id="saveBtn">Save play</div>';
      }
    } else if(canAdvanceTwoPt(stepName)){
      html += '<div class="navbtn primary" id="tpNextBtn">Continue</div>';
    }
    html += '</div>';

    return html;
  }

  function attachTwoPointHandlers(){
    document.querySelectorAll('[data-act="picktp3"]').forEach(function(el){
      el.addEventListener('click', function(){
        var field = el.dataset.field, val = el.dataset.val;
        current.twoPt[field] = val === '' ? null : val;
        var steps = getTwoPtSteps();
        if(tpStepIdx < steps.length - 1) tpStepIdx++;
        render();
      });
    });
    document.querySelectorAll('[data-act="toggletagtp"]').forEach(function(el){
      el.addEventListener('click', function(){
        var val = el.dataset.val;
        var i = current.twoPt.tag.indexOf(val);
        if(i === -1) current.twoPt.tag.push(val); else current.twoPt.tag.splice(i, 1);
        render();
      });
    });
    document.querySelectorAll('[data-act="cleartagtp"]').forEach(function(el){
      el.addEventListener('click', function(){
        current.twoPt.tag = [];
        render();
      });
    });
    var back = document.getElementById('tpBackBtn');
    if(back) back.addEventListener('click', function(){
      if(tpStepIdx > 0){
        tpStepIdx--;
      } else {
        stepIdx--; // leave the 2-point flow, back to the touchdown toggle
      }
      render();
    });
    var next = document.getElementById('tpNextBtn');
    if(next) next.addEventListener('click', function(){
      tpStepIdx++;
      render();
    });
    var save = document.getElementById('saveBtn');
    if(save) save.addEventListener('click', savePlay);
  }

  function ordinal(n){
    return n===1?'1st':n===2?'2nd':n===3?'3rd':'4th';
  }

  // ---------- storage (Firebase Firestore, live-synced) ----------
  // Data lives in Firestore now, not just this device. Anyone with the
  // link sees the game update live (read access is open). Only a
  // signed-in coach can actually save changes — enforced both by the
  // Firestore security rules and by hiding the controls here.

  function loadAll(){
    window.FB.onAuthChange(function(user){
      isCoach = !!user;
      authReady = true;
      updateAuthUI();
      render();
    });

    window.FB.subscribeGame(function(data){
      if(data){
        plays = data.plays || [];
        oppEvents = data.oppEvents || [];
        meta = data.meta || { gameLabel: '' };
      } else {
        plays = [];
        oppEvents = [];
        meta = { gameLabel: '' };
      }
      document.getElementById('gameLabel').value = meta.gameLabel || '';
      current = freshPlay();
      lastLoadedFromRemote = true;
      render();
    });

    render();
  }

  function syncGame(){
    if(!isCoach){
      updateStatusBadge(false, 'Sign in to save changes');
      return;
    }
    window.FB.saveGame({ plays: plays, oppEvents: oppEvents, meta: meta })
      .then(function(){ updateStatusBadge(true); })
      .catch(function(err){
        console.error('Save failed', err);
        updateStatusBadge(false, 'Save failed — check connection');
      });
  }

  function savePlays(){ syncGame(); }
  function saveMeta(){ syncGame(); }
  function saveOppEvents(){ syncGame(); }

  var warnedStorage = false;

  function updateStatusBadge(ok, msg){
    var el = document.getElementById('saveStatus');
    if(!el) return;
    if(ok){
      el.textContent = '';
    } else {
      el.textContent = msg || 'Not saving — check connection';
      if(!warnedStorage){
        warnedStorage = true;
        flashSaveWarning(msg);
      }
    }
  }

  function flashSaveWarning(msg){
    // Shown once per session, the first time a save fails.
    var inner = document.getElementById('undoInner');
    document.getElementById('undoText').textContent = msg || "Can't save — export CSV to back up";
    inner.classList.add('show');
    clearTimeout(undoTimer);
    undoTimer = setTimeout(function(){ inner.classList.remove('show'); }, 6000);
  }

  // ---------- coach sign-in ----------
  function updateAuthUI(){
    var el = document.getElementById('authBar');
    if(!el) return;

    if(!authReady){
      el.innerHTML = '<div style="font-size:11px; color:var(--chalk-dim);">Connecting&hellip;</div>';
      return;
    }

    if(isCoach){
      el.innerHTML =
        '<div style="display:flex; justify-content:space-between; align-items:center; font-size:12px;">' +
        '<span style="color:var(--gain); font-weight:700;">&#10003; Signed in as coach</span>' +
        '<span id="signOutLink" style="text-decoration:underline; cursor:pointer; color:var(--chalk-dim);">Sign out</span>' +
        '</div>';
      var so = document.getElementById('signOutLink');
      if(so) so.addEventListener('click', function(){ window.FB.signOutCoach(); });
      return;
    }

    if(!signInFormOpen){
      el.innerHTML =
        '<div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--chalk-dim);">' +
        '<span>Viewing only</span>' +
        '<span id="signInLink" style="text-decoration:underline; cursor:pointer; color:var(--gold);">Coach sign in</span>' +
        '</div>';
      var si = document.getElementById('signInLink');
      if(si) si.addEventListener('click', function(){ signInFormOpen = true; updateAuthUI(); });
    } else {
      el.innerHTML =
        '<div style="background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px;">' +
        '<input id="authEmail" type="email" placeholder="Email" autocapitalize="none" autocorrect="off" style="width:100%; margin-bottom:6px; padding:8px; border-radius:6px; border:1px solid var(--line); background:var(--field-deep); color:var(--chalk); font-size:14px; box-sizing:border-box;">' +
        '<input id="authPass" type="password" placeholder="Password" style="width:100%; margin-bottom:8px; padding:8px; border-radius:6px; border:1px solid var(--line); background:var(--field-deep); color:var(--chalk); font-size:14px; box-sizing:border-box;">' +
        (signInError ? '<div style="color:var(--loss); font-size:11px; margin-bottom:8px;">' + signInError + '</div>' : '') +
        '<div style="display:flex; gap:8px;">' +
        '<div class="navbtn back" id="authCancel" style="flex:1; padding:8px; font-size:13px;">Cancel</div>' +
        '<div class="navbtn primary" id="authSubmit" style="flex:1; padding:8px; font-size:13px;">Sign in</div>' +
        '</div></div>';
      document.getElementById('authCancel').addEventListener('click', function(){
        signInFormOpen = false; signInError = ''; updateAuthUI();
      });
      document.getElementById('authSubmit').addEventListener('click', function(){
        var email = document.getElementById('authEmail').value.trim();
        var pass = document.getElementById('authPass').value;
        if(!email || !pass){ signInError = 'Enter email and password'; updateAuthUI(); return; }
        signInError = '';
        window.FB.signIn(email, pass).then(function(){
          signInFormOpen = false;
          signInError = '';
          // onAuthChange fires separately and re-renders once confirmed.
        }).catch(function(){
          signInError = 'Sign in failed — check email/password';
          updateAuthUI();
        });
      });
    }
  }

  // ---------- render ----------
  function computeScore(){
    return realPlays().reduce(function(sum, p){
      if(p.outcome !== 'TD') return sum;
      var pts = 6;
      if(p.twoPtResult === 'Good') pts += 2;
      return sum + pts;
    }, 0);
  }

  function render(){
    document.getElementById('tabCount').textContent = realPlays().length;
    document.getElementById('scoreBadge').textContent = computeScore() + ' - ' + getOppScore();
    document.querySelectorAll('.tab').forEach(function(t){
      t.classList.toggle('active', t.dataset.tab === activeTab);
    });
    if(activeTab === 'chart') renderChart();
    else renderLog();
  }

  function renderChart(){
    var main = document.getElementById('main');

    if(!authReady){
      main.innerHTML = '<div style="padding:60px 20px; text-align:center; color:var(--chalk-dim);">Connecting&hellip;</div>';
      return;
    }
    if(!isCoach){
      main.innerHTML =
        '<div style="padding:50px 24px; text-align:center;">' +
        '<div style="font-family:\'Bebas Neue\',\'Arial Narrow\',sans-serif; font-size:24px; color:var(--chalk); margin-bottom:10px;">Viewing only</div>' +
        '<div style="color:var(--chalk-dim); font-size:14px;">Sign in as coach above to chart plays. You can still watch the log update live.</div>' +
        '</div>';
      return;
    }

    var steps = getSteps();
    var stepName = steps[stepIdx];
    var html = '';

    if(stepName === 'twopoint'){
      html += '<div class="buildbar">' + buildChips(steps) + '</div>';
      html += renderTwoPointStep();
      main.innerHTML = html;
      attachTwoPointHandlers();
      return;
    }

    html += '<div class="buildbar">' + buildChips(steps) + '</div>';

    if(stepName === 'formation'){
      html += '<div class="stepLabel">Formation</div>';
      html += '<div class="grid cols2">';
      FORMATIONS.forEach(function(f){
        html += bigBtn(f, f === current.formation, 'pick', 'formation', f);
      });
      html += '</div>';
      if(realPlays().length){
        html += '<div class="grid cols1" style="margin-top:10px;">';
        html += '<div class="bigbtn" id="greenBtn" style="background:var(--gain); color:var(--ink); border-color:var(--gain);">Green<span class="sub" style="color:rgba(12,36,29,0.7);">Same play, same formation</span></div>';
        html += '</div>';
      }
    }

    else if(stepName === 'alignment'){
      html += '<div class="stepLabel">Alignment <span style="opacity:0.6;font-weight:400; text-transform:none; letter-spacing:0;">(skip for Normal)</span></div>';
      html += '<div class="grid cols3" style="grid-template-columns:repeat(3,1fr);">';
      ALIGNMENT_OPTIONS.forEach(function(a){
        html += bigBtn(a, a === current.alignment, 'pick', 'alignment', a, 'small');
      });
      html += '</div>';
    }

    else if(stepName === 'motion'){
      html += '<div class="stepLabel">Motion <span style="opacity:0.6;font-weight:400;">(optional)</span></div>';
      html += '<div class="grid cols3" style="grid-template-columns:repeat(3,1fr);">';
      MOTION_OPTIONS.forEach(function(m){
        html += bigBtn(m, m === current.motion, 'pick', 'motion', m, 'small');
      });
      html += '</div>';
      html += '<div class="grid cols2" style="margin-top:10px;">';
      html += '<div class="bigbtn skip" data-act="pick" data-field="motion" data-val="">No motion</div>';
      html += '</div>';
    }

    else if(stepName === 'category'){
      html += '<div class="stepLabel">Play type</div>';
      html += '<div class="grid cols3">';
      ['Run','Pass','RPO'].forEach(function(c){
        html += bigBtn(c, c === current.category, 'pick', 'category', c, 'small');
      });
      html += '</div>';
    }

    else if(stepName === 'play'){
      var list = current.category === 'Run' ? RUN_PLAYS : current.category === 'Pass' ? PASS_PLAYS : RPO_PLAYS;
      html += '<div class="stepLabel">' + current.category + ' call</div>';
      html += '<div class="grid ' + (list.length > 6 ? 'cols3' : 'cols2') + '">';
      list.forEach(function(p){
        html += bigBtn(p, p === current.play, 'pick', 'play', p);
      });
      html += '</div>';
    }

    else if(stepName === 'direction'){
      html += '<div class="stepLabel">Direction</div>';
      html += '<div class="grid cols2">';
      ['Up','Down'].forEach(function(d){
        html += bigBtn(d, d === current.direction, 'pick', 'direction', d);
      });
      html += '</div>';
    }

    else if(stepName === 'tag'){
      html += '<div class="stepLabel">Tag <span style="opacity:0.6;font-weight:400;">(optional, pick as many as apply)</span></div>';
      html += '<div class="grid cols3">';
      TAG_OPTIONS.forEach(function(t){
        html += bigBtn(t, current.tag.indexOf(t) !== -1, 'toggletag', 'tag', t, 'small');
      });
      html += '</div>';
      if(current.tag.length){
        html += '<div class="grid cols2" style="margin-top:10px;">';
        html += '<div class="bigbtn skip" data-act="cleartag">Clear tags</div>';
        html += '</div>';
      }
    }

    else if(stepName === 'downdistance'){
      html += '<div class="stepLabel">Down</div>';
      html += '<div class="grid cols4" style="grid-template-columns:repeat(4,1fr);">';
      [1,2,3,4].forEach(function(d){
        html += bigBtn(ordinal(d), d === current.down, 'pickraw', 'down', d, 'small');
      });
      html += '</div>';
      html += '<div class="stepLabel" style="margin-top:18px;">Distance</div>';
      html += '<div class="stepperRow">';
      html += '<div class="stepperBtn" data-act="distance" data-delta="-1">&minus;</div>';
      html += '<div class="stepperVal">' + current.distance + '</div>';
      html += '<div class="stepperBtn" data-act="distance" data-delta="1">+</div>';
      html += '</div>';
      html += '<div class="chipsRow">';
      [1,2,3,5,7,10,15,20].forEach(function(v){
        html += '<div class="quickchip" data-act="distanceset" data-val="' + v + '">' + v + '</div>';
      });
      html += '</div>';
    }

    else if(stepName === 'result'){
      var isPenalty = (current.outcome === 'OPEN' || current.outcome === 'DPEN');
      html += '<div class="stepLabel">' + (isPenalty ? 'Penalty yardage' : 'Result (yards)') + '</div>';
      var valClass = current.yards > 0 ? 'pos' : current.yards < 0 ? 'neg' : '';
      html += '<div class="stepperRow">';
      html += '<div class="stepperBtn" data-act="yards" data-delta="-1">&minus;</div>';
      html += '<div class="stepperVal ' + valClass + '">' + current.yards + '</div>';
      html += '<div class="stepperBtn" data-act="yards" data-delta="1">+</div>';
      html += '</div>';
      html += '<div class="chipsRow">';
      var yardChips = isPenalty ? [5,10,15] : [-10,-5,-2,-1,0,2,4,6,8,10,15,20,25,40];
      yardChips.forEach(function(v){
        html += '<div class="quickchip" data-act="yardsset" data-val="' + v + '">' + (v>0?'+':'') + v + '</div>';
      });
      html += '</div>';
      if(isPenalty){
        html += '<div style="font-size:12px; color:var(--chalk-dim); text-align:center; margin-top:-6px; margin-bottom:14px;">' +
          (current.outcome === 'DPEN' ? 'Same down, moves the chains toward a first down' : 'Same down, pushes the offense back') +
          '</div>';
      }
      html += '<div class="chipsRow">';
      html += '<div class="togglechip td ' + (current.outcome==='TD'?'on td':'') + '" data-act="outcome" data-val="TD">Touchdown</div>';
      html += '</div>';
      html += '<div class="chipsRow">';
      html += '<div class="togglechip to ' + (current.outcome==='FUM'?'on to':'') + '" data-act="outcome" data-val="FUM">Fumble</div>';
      html += '<div class="togglechip to ' + (current.outcome==='INT'?'on to':'') + '" data-act="outcome" data-val="INT">Interception</div>';
      html += '<div class="togglechip to ' + (current.outcome==='TOD'?'on to':'') + '" data-act="outcome" data-val="TOD">TO on downs</div>';
      html += '</div>';
      html += '<div class="chipsRow">';
      html += '<div class="togglechip penO ' + (current.outcome==='OPEN'?'on penO':'') + '" data-act="outcome" data-val="OPEN">Offensive penalty<br><span style="font-weight:400; font-size:11px; opacity:0.85;">adds yards, hurts us</span></div>';
      html += '<div class="togglechip penD ' + (current.outcome==='DPEN'?'on penD':'') + '" data-act="outcome" data-val="DPEN">Defensive penalty<br><span style="font-weight:400; font-size:11px; opacity:0.85;">subtracts yards, helps us</span></div>';
      html += '</div>';
    }

    var isLastStep = (stepIdx === steps.length - 1);

    html += '<div class="navrow">';
    if(stepIdx > 0){
      html += '<div class="navbtn back" id="backBtn">Back</div>';
    }
    if(isLastStep){
      if(canAdvance(stepName)){
        html += '<div class="navbtn primary" id="saveBtn">Save play</div>';
      }
    } else if(canAdvance(stepName)){
      html += '<div class="navbtn primary" id="nextBtn">Continue</div>';
    }
    html += '</div>';

    main.innerHTML = html;
    attachChartHandlers();
  }

  function canAdvance(stepName){
    if(stepName === 'formation') return !!current.formation;
    if(stepName === 'alignment') return true;
    if(stepName === 'category') return !!current.category;
    if(stepName === 'play') return !!current.play;
    if(stepName === 'direction') return !!current.direction;
    if(stepName === 'tag') return true;
    if(stepName === 'motion') return true;
    if(stepName === 'downdistance') return true;
    return true;
  }

  function bigBtn(label, selected, act, field, val, extraClass){
    return '<div class="bigbtn ' + (selected?'selected':'') + ' ' + (extraClass||'') + '" data-act="' + act + '" data-field="' + field + '" data-val="' + val + '">' + label + '</div>';
  }

  function buildChips(steps){
    var order = [
      ['formation', current.formation],
      ['alignment', current.alignment],
      ['motion', current.motion],
      ['category', current.category],
      ['play', current.play],
      ['direction', current.direction]
    ];
    var out = '';
    order.forEach(function(pair){
      if(steps.indexOf(pair[0]) === -1) return;
      var val = pair[1];
      if(!val) return;
      var label = val;
      out += '<div class="chip filled">' + label + '</div>';
    });
    if(steps.indexOf('tag') !== -1 && current.tag && current.tag.length){
      current.tag.forEach(function(t){
        out += '<div class="chip filled">' + t + '</div>';
      });
    }
    if(!out) out = '<div class="chip" style="opacity:0.5;">Building play&hellip;</div>';
    return out;
  }

  function attachChartHandlers(){
    document.querySelectorAll('[data-act="pick"]').forEach(function(el){
      el.addEventListener('click', function(){
        var field = el.dataset.field, val = el.dataset.val;
        current[field] = val === '' ? null : val;
        stepIdx++;
        render();
      });
    });
    document.querySelectorAll('[data-act="toggletag"]').forEach(function(el){
      el.addEventListener('click', function(){
        var val = el.dataset.val;
        var i = current.tag.indexOf(val);
        if(i === -1) current.tag.push(val); else current.tag.splice(i, 1);
        render();
      });
    });
    document.querySelectorAll('[data-act="cleartag"]').forEach(function(el){
      el.addEventListener('click', function(){
        current.tag = [];
        render();
      });
    });
    document.querySelectorAll('[data-act="pickraw"]').forEach(function(el){
      el.addEventListener('click', function(){
        current[el.dataset.field] = parseInt(el.dataset.val, 10);
        render();
      });
    });
    document.querySelectorAll('[data-act="distance"]').forEach(function(el){
      el.addEventListener('click', function(){
        current.distance = Math.max(1, current.distance + parseInt(el.dataset.delta,10));
        render();
      });
    });
    document.querySelectorAll('[data-act="distanceset"]').forEach(function(el){
      el.addEventListener('click', function(){
        current.distance = parseInt(el.dataset.val,10);
        render();
      });
    });
    document.querySelectorAll('[data-act="yards"]').forEach(function(el){
      el.addEventListener('click', function(){
        var isPenalty = (current.outcome === 'OPEN' || current.outcome === 'DPEN');
        var next = current.yards + parseInt(el.dataset.delta,10);
        current.yards = isPenalty ? Math.max(1, next) : next;
        render();
      });
    });
    document.querySelectorAll('[data-act="yardsset"]').forEach(function(el){
      el.addEventListener('click', function(){
        var isPenalty = (current.outcome === 'OPEN' || current.outcome === 'DPEN');
        var val = parseInt(el.dataset.val,10);
        current.yards = isPenalty ? Math.max(1, val) : val;
        render();
      });
    });
    document.querySelectorAll('[data-act="outcome"]').forEach(function(el){
      el.addEventListener('click', function(){
        var v = el.dataset.val;
        current.outcome = (current.outcome === v) ? null : v;
        if(current.outcome === 'OPEN' || current.outcome === 'DPEN'){
          current.yards = Math.max(1, current.yards);
        }
        render();
      });
    });
    var back = document.getElementById('backBtn');
    if(back) back.addEventListener('click', function(){ stepIdx = Math.max(0, stepIdx-1); render(); });
    var next = document.getElementById('nextBtn');
    if(next) next.addEventListener('click', function(){
      var steps = getSteps();
      if(steps[stepIdx + 1] === 'twopoint'){
        current.twoPt = freshTwoPt();
        tpStepIdx = 0;
      }
      stepIdx++;
      render();
    });
    var save = document.getElementById('saveBtn');
    if(save) save.addEventListener('click', savePlay);
    var green = document.getElementById('greenBtn');
    if(green) green.addEventListener('click', function(){
      var rp = realPlays();
      var last = rp[rp.length - 1];
      if(!last) return;
      current.formation = last.formation;
      current.alignment = last.alignment || null;
      current.motion = last.motion || null;
      current.category = last.category;
      current.play = last.play;
      current.direction = last.direction || null;
      current.tag = last.tag ? last.tag.split(', ') : [];
      var steps = getSteps();
      stepIdx = steps.indexOf('downdistance');
      render();
    });
  }

  function savePlay(){
    var tp = current.twoPt || freshTwoPt();
    var entry = {
      formation: current.formation,
      alignment: current.alignment || '',
      motion: current.motion || '',
      category: current.category,
      play: current.play,
      direction: current.direction || '',
      tag: (current.tag || []).join(', '),
      down: current.down,
      distance: current.distance,
      yards: current.yards,
      outcome: current.outcome || '',
      twoPtFormation: tp.formation || '',
      twoPtAlignment: tp.alignment || '',
      twoPtMotion: tp.motion || '',
      twoPtCategory: tp.category || '',
      twoPtPlay: tp.play || '',
      twoPtDirection: tp.direction || '',
      twoPtTag: (tp.tag || []).join(', '),
      twoPtResult: tp.result || '',
      time: new Date().toISOString()
    };
    plays.push(entry);
    // Snapshot both running scores as of this play (including any points
    // this play itself just scored), so the CSV shows the score
    // progression alongside each play rather than just a final total.
    entry.usScore = computeScore();
    entry.oppScore = getOppScore();
    savePlays();
    tpStepIdx = 0;
    current = freshPlay(false);
    stepIdx = 0;
    render();
  }

  function renderRunReport(){
    var report = buildRunReport();
    var html = '<div style="background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:16px;">';

    html += '<div class="stepLabel">Explosive plays <span style="opacity:0.6; font-weight:400; text-transform:none; letter-spacing:0;">(Run 10+, RPO 12+, Pass 15+)</span></div>';
    if(!report.explosive.length){
      html += '<div style="font-size:13px; color:var(--chalk-dim); margin-bottom:14px;">None yet.</div>';
    } else {
      html += '<div style="margin-bottom:14px;">';
      report.explosive.forEach(function(p){
        var parts = [p.formation];
        if(p.alignment) parts.push(p.alignment);
        if(p.motion) parts.push(p.motion);
        parts.push(p.category + ' ' + p.play);
        if(p.direction) parts.push(p.direction);
        if(p.tag) parts.push(p.tag);
        html += '<div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line);">';
        html += '<div style="font-size:13px; color:var(--chalk);">' + parts.join(' &middot; ') + '<div style="font-size:11px; color:var(--chalk-dim); margin-top:2px;">' + ordinal(p.down) + ' &amp; ' + p.distance + '</div></div>';
        html += '<div style="font-family:\'Bebas Neue\',\'Arial Narrow\',sans-serif; font-size:22px; color:var(--gain); flex-shrink:0; padding-left:10px;">+' + p.yards + '</div>';
        html += '</div>';
      });
      html += '</div>';
    }

    html += '<div class="stepLabel">Best play calls <span style="opacity:0.6; font-weight:400; text-transform:none; letter-spacing:0;">(by average yards)</span></div>';
    if(!report.calls.length){
      html += '<div style="font-size:13px; color:var(--chalk-dim);">No stat plays charted yet.</div>';
    } else {
      report.calls.forEach(function(c){
        html += '<div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line);">';
        html += '<div style="font-size:14px; font-weight:700; color:var(--chalk);">' + c.key + '<div style="font-size:11px; color:var(--chalk-dim); margin-top:2px;">' + c.count + ' call' + (c.count===1?'':'s') + ' &middot; ' + (c.total>0?'+':'') + c.total + ' total yds</div></div>';
        html += '<div style="font-family:\'Bebas Neue\',\'Arial Narrow\',sans-serif; font-size:24px; color:var(--gold); flex-shrink:0; padding-left:10px;">' + c.avg.toFixed(1) + '</div>';
        html += '</div>';
      });
    }

    html += '</div>';
    return html;
  }

  // ---------- log tab ----------
  function renderLog(){
    var main = document.getElementById('main');
    var html = '';
    var rp = realPlays();
    var runCount = rp.filter(function(p){return p.category==='Run';}).length;
    var passCount = rp.filter(function(p){return p.category==='Pass';}).length;
    var rpoCount = rp.filter(function(p){return p.category==='RPO';}).length;

    html += '<div class="statsRow">';
    html += statCard(computeScore(), 'YMS');
    html += statCard(getOppScore(), 'Opponent');
    html += statCard(rp.length, 'Plays');
    html += statCard(runCount, 'Run');
    html += statCard(passCount, 'Pass');
    html += statCard(rpoCount, 'RPO');
    html += '</div>';

    if(isCoach){
      html += '<div style="background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:16px;">';
      html += '<div class="stepLabel" style="margin-bottom:10px;">End of quarter</div>';
      html += '<div class="grid cols4" style="grid-template-columns:repeat(4,1fr); gap:8px;">';
      ['1st','2nd','3rd','4th'].forEach(function(q, i){
        html += '<div class="bigbtn small" data-act="quarter" data-val="' + (i+1) + '" style="padding:12px 4px; font-size:18px;">' + q + '</div>';
      });
      html += '</div>';
      html += '</div>';

      html += '<div style="background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:16px;">';
      html += '<div class="stepLabel" style="margin-bottom:10px;">Opponent scored</div>';
      html += '<div class="grid cols4" style="grid-template-columns:repeat(4,1fr); gap:8px;">';
      [1,2,3,6].forEach(function(pts){
        html += '<div class="bigbtn small" data-act="oppadd" data-val="' + pts + '" style="padding:12px 4px; font-size:20px;">+' + pts + '</div>';
      });
      html += '</div>';
      if(oppEvents.length){
        html += '<div style="margin-top:10px; display:flex; flex-wrap:wrap; gap:6px;">';
        oppEvents.forEach(function(e, i){
          html += '<div class="chip filled" data-act="oppdel" data-idx="' + i + '" style="cursor:pointer;">+' + e.points + ' &#10005;</div>';
        });
        html += '</div>';
        html += '<div style="font-size:11px; color:var(--chalk-dim); margin-top:6px;">Tap a chip to remove it if you tapped the wrong score</div>';
      }
      html += '</div>';
    }

    html += '<div class="navbtn' + (reportOpen ? ' primary' : ' back') + '" id="reportBtn" style="margin-bottom:16px;">' + (reportOpen ? 'Hide Run Report' : 'Run Report') + '</div>';
    if(reportOpen){
      html += renderRunReport();
    }

    if(!plays.length){
      html += '<div class="emptyState"><div class="big">No plays charted yet</div>Head to Chart to log the first snap.</div>';
    } else {
      var rev = plays.map(function(p,i){ return {p:p, idx:i}; }).reverse();
      rev.forEach(function(item){
        var p = item.p, i = item.idx;

        if(p.isMarker){
          html += '<div style="display:flex; align-items:center; gap:10px; margin:14px 0; color:var(--gold);">';
          html += '<div style="flex:1; height:1px; background:var(--gold);"></div>';
          html += '<div style="font-family:\'Bebas Neue\',\'Arial Narrow\',sans-serif; font-size:16px; letter-spacing:1px; white-space:nowrap;">' + p.label + '</div>';
          html += '<div style="flex:1; height:1px; background:var(--gold);"></div>';
          if(isCoach) html += '<div class="del" data-idx="' + i + '" style="flex-shrink:0;">&#10005;</div>';
          html += '</div>';
          return;
        }

        var descParts = [p.formation];
        if(p.alignment) descParts.push(p.alignment);
        if(p.motion) descParts.push(p.motion);
        descParts.push(p.category + ' ' + p.play);
        if(p.direction) descParts.push(p.direction);
        if(p.tag) descParts.push(p.tag);
        var metaParts = [];
        if(p.outcome === 'TD'){
          var tpLine = 'Touchdown';
          if(p.twoPtResult){
            var tpDesc = [p.twoPtFormation];
            if(p.twoPtAlignment) tpDesc.push(p.twoPtAlignment);
            if(p.twoPtMotion) tpDesc.push(p.twoPtMotion);
            tpDesc.push(p.twoPtCategory + ' ' + p.twoPtPlay);
            if(p.twoPtDirection) tpDesc.push(p.twoPtDirection);
            if(p.twoPtTag) tpDesc.push(p.twoPtTag);
            tpLine += ' &middot; 2PT ' + tpDesc.join(' ') + ': ' + p.twoPtResult;
          }
          metaParts.push(tpLine);
        }
        if(p.outcome === 'FUM') metaParts.push('Fumble');
        if(p.outcome === 'INT') metaParts.push('Interception');
        if(p.outcome === 'TOD') metaParts.push('Turnover on downs');
        if(p.outcome === 'OPEN') metaParts.push('Offensive penalty');
        if(p.outcome === 'DPEN') metaParts.push('Defensive penalty');
        html += '<div class="logrow">';
        html += '<div class="dd">' + ordinal(p.down) + '<br>&amp; ' + p.distance + '</div>';
        html += '<div class="main"><div class="playline">' + descParts.join(' &middot; ') + '</div>';
        html += '<div class="metaline">' + (metaParts.length ? metaParts.join(', ') : '&nbsp;') + '</div></div>';
        html += '<div class="yards ' + (p.yards>0?'pos':p.yards<0?'neg':'') + '">' + (p.yards>0?'+':'') + p.yards + '</div>';
        if(isCoach) html += '<div class="del" data-idx="' + i + '">&#10005;</div>';
        html += '</div>';
      });
    }

    html += '<div class="logActions">';
    if(isCoach){
      if(clearArmed){
        html += '<div class="navbtn" id="clearBtn" style="background:var(--loss); border-color:var(--loss); color:#fff;">Tap again to confirm</div>';
      } else {
        html += '<div class="navbtn back" id="clearBtn">Clear &amp; close game</div>';
      }
    }
    html += '<div class="navbtn primary" id="exportBtn">Export CSV</div>';
    html += '</div>';

    main.innerHTML = html;

    var reportBtn = document.getElementById('reportBtn');
    if(reportBtn) reportBtn.addEventListener('click', function(){
      reportOpen = !reportOpen;
      render();
    });

    document.querySelectorAll('.del').forEach(function(el){
      el.addEventListener('click', function(){
        var idx = parseInt(el.dataset.idx,10);
        deletePlay(idx);
      });
    });
    document.querySelectorAll('[data-act="quarter"]').forEach(function(el){
      el.addEventListener('click', function(){
        var q = parseInt(el.dataset.val,10);
        var ord = q===1?'1st':q===2?'2nd':q===3?'3rd':'4th';
        plays.push({ isMarker: true, label: 'End of ' + ord + ' Quarter', time: new Date().toISOString() });
        savePlays();
        render();
      });
    });
    document.querySelectorAll('[data-act="oppadd"]').forEach(function(el){
      el.addEventListener('click', function(){
        oppEvents.push({ points: parseInt(el.dataset.val,10), time: new Date().toISOString() });
        saveOppEvents();
        render();
      });
    });
    document.querySelectorAll('[data-act="oppdel"]').forEach(function(el){
      el.addEventListener('click', function(){
        var idx = parseInt(el.dataset.idx,10);
        oppEvents.splice(idx, 1);
        saveOppEvents();
        render();
      });
    });
    var clearBtn = document.getElementById('clearBtn');
    if(clearBtn) clearBtn.addEventListener('click', function(){
      if(!plays.length && !oppEvents.length) return;
      if(!clearArmed){
        clearArmed = true;
        clearTimeout(clearArmTimer);
        clearArmTimer = setTimeout(function(){ clearArmed = false; render(); }, 4000);
        render();
        return;
      }
      clearArmed = false;
      clearTimeout(clearArmTimer);
      plays = [];
      oppEvents = [];
      savePlays();
      saveOppEvents();
      render();
    });
    document.getElementById('exportBtn').addEventListener('click', exportCSV);
  }

  function statCard(num, label){
    return '<div class="statCard"><div class="num">' + num + '</div><div class="lbl">' + label + '</div></div>';
  }

  function deletePlay(idx){
    lastDeleted = { entry: plays[idx], idx: idx };
    plays.splice(idx, 1);
    savePlays();
    render();
    showUndo();
  }

  function showUndo(){
    var inner = document.getElementById('undoInner');
    document.getElementById('undoText').textContent = 'Play deleted';
    inner.classList.add('show');
    clearTimeout(undoTimer);
    undoTimer = setTimeout(function(){ inner.classList.remove('show'); lastDeleted = null; }, 5000);
  }

  document.getElementById('undoBtn').addEventListener('click', function(){
    if(lastDeleted){
      plays.splice(lastDeleted.idx, 0, lastDeleted.entry);
      savePlays();
      lastDeleted = null;
      render();
    }
    document.getElementById('undoInner').classList.remove('show');
  });

  function exportCSV(){
    var headers = ['Down','Distance','Formation','Alignment','Motion','Category','Play','Direction','Tag','Yards','Outcome','2PT Formation','2PT Alignment','2PT Motion','2PT Category','2PT Play','2PT Direction','2PT Tag','2PT Result','YMS Score','Opp Score','Time'];
    var rows = plays.map(function(p){
      if(p.isMarker){
        return ['', '', '— ' + p.label + ' —', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', p.time];
      }
      return [p.down, p.distance, p.formation, p.alignment, p.motion, p.category, p.play, p.direction, p.tag, p.yards, p.outcome, p.twoPtFormation, p.twoPtAlignment, p.twoPtMotion, p.twoPtCategory, p.twoPtPlay, p.twoPtDirection, p.twoPtTag, p.twoPtResult, p.usScore, p.oppScore, p.time];
    });

    function csvRow(arr){
      return arr.map(function(v){
        var s = String(v === undefined || v === null ? '' : v);
        if(s.indexOf(',') > -1 || s.indexOf('"') > -1){
          s = '"' + s.replace(/"/g,'""') + '"';
        }
        return s;
      }).join(',');
    }

    var summary = [
      csvRow(['Game', meta.gameLabel || '']),
      csvRow(['Final Score', 'YMS ' + computeScore() + ' - Opponent ' + getOppScore()]),
      csvRow(['YMS Score', computeScore()]),
      csvRow(['Opponent Score', getOppScore()]),
      ''
    ].join('\n');

    var csv = summary + '\n' + csvRow(headers) + '\n' + rows.map(csvRow).join('\n');

    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var name = (meta.gameLabel || 'game').trim().replace(/[^a-z0-9\-]+/gi,'-').replace(/^-+|-+$/g,'') || 'game';
    a.href = url;
    a.download = name + '-play-chart.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- tabs & meta ----------
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      activeTab = t.dataset.tab;
      render();
    });
  });

  var glInput = document.getElementById('gameLabel');
  var glTimer = null;
  glInput.addEventListener('input', function(){
    meta.gameLabel = glInput.value;
    clearTimeout(glTimer);
    glTimer = setTimeout(saveMeta, 400);
  });

  window.addEventListener('beforeunload', function(e){
    if(plays.length > 0 || oppEvents.length > 0){
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
  });

  function waitForFirebase(cb){
    if(window.FB){ cb(); } else { setTimeout(function(){ waitForFirebase(cb); }, 30); }
  }
  render(); // show "Connecting…" immediately while Firebase loads
  updateAuthUI();
  waitForFirebase(loadAll);
})();
</script>
</body>
</html>
